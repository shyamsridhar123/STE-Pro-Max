name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the native package
        run: python -m pip install .
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify original SVG primitives and generated examples
        run: |
          node --test tests/line-math.test.cjs tests/line-studio.test.cjs tests/retry-observatory.test.cjs
          node tools/build_line_studio.mjs --check
      - name: Verify fresh quickstart and no-install reuse
        run: python tools/verify_quickstart.py --evidence-dir "${{ runner.temp }}/ste-first-run"
